name: CI

on:
  pull_request:
    branches: [development, main]
  push:
    branches: [development, main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NODE_VERSION: "22"
  PNPM_VERSION: "9.12.0"

jobs:
  # ── Fast gates. Everything here must pass before anything expensive runs. ──
  quality:
    name: Format · Lint · Types
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Formatting
        run: pnpm format:check
      - name: Lint
        run: pnpm lint
      - name: Type-check
        run: pnpm typecheck

  guardrails:
    name: Neutrality · Palette · Fixtures
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile

      # docs/15 is binding. A hit here is a release blocker, not a warning.
      - name: G1 · Neutrality (all locales)
        run: pnpm neutrality

      - name: G3 · Palette — no red in any data token
        run: pnpm exec vitest run apps/web/src/ui/tokens.test.ts

      - name: G6 · Fixture data absent from the production bundle
        run: |
          pnpm --filter @lokdarpan/web build
          if grep -rl "not a government source" apps/web/.next/static 2>/dev/null; then
            echo "::error::fixture data leaked into the production bundle"
            exit 1
          fi
          echo "no fixture data in static bundle"

  test:
    name: Unit + Integration
    runs-on: ubuntu-latest
    # PostGIS, not plain Postgres: migration 0001 creates the extension, and a
    # schema that only ever ran on a developer's laptop is not verified.
    services:
      postgres:
        image: postgis/postgis:16-3.4
        env:
          POSTGRES_USER: lokdarpan
          POSTGRES_PASSWORD: lokdarpan_ci_only
          POSTGRES_DB: lokdarpan
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U lokdarpan -d lokdarpan"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 20
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Migrations apply to a real PostGIS database
        run: pnpm --filter @lokdarpan/database migrate
        env:
          DATABASE_URL: postgresql://lokdarpan:lokdarpan_ci_only@localhost:5432/lokdarpan
      - name: Provision the API's read-only database user
        run: |
          PGPASSWORD=lokdarpan_ci_only psql -h localhost -U lokdarpan -d lokdarpan \
            -v ON_ERROR_STOP=1 -f database/scripts/create-local-api-user.sql
      - name: Provision the reviewer's database user
        run: |
          PGPASSWORD=lokdarpan_ci_only psql -h localhost -U lokdarpan -d lokdarpan \
            -v ON_ERROR_STOP=1 -f database/scripts/create-local-reviewer-user.sql
      - name: Unit + integration tests
        run: pnpm test
        env:
          DATABASE_URL: postgresql://lokdarpan:lokdarpan_ci_only@localhost:5432/lokdarpan
          # Asserts the API's role cannot write. A green suite without this set
          # would silently skip the check that the ledger is protected.
          DATABASE_URL_READONLY: postgresql://lokdarpan_api:lokdarpan_local_only@localhost:5432/lokdarpan
          # Asserts the reviewer can record a decision but cannot rewrite what
          # the parser read. Unset, that boundary check silently skips.
          DATABASE_URL_REVIEWER: postgresql://lokdarpan_review:lokdarpan_local_only@localhost:5432/lokdarpan
      - name: Coverage thresholds (domain + api)
        run: pnpm exec vitest run --coverage
        env:
          # The coverage run needs the database too. Without it the integration
          # suites skip, the loaders read as uncovered, and the threshold fails
          # for a reason that has nothing to do with the code.
          DATABASE_URL: postgresql://lokdarpan:lokdarpan_ci_only@localhost:5432/lokdarpan
          DATABASE_URL_READONLY: postgresql://lokdarpan_api:lokdarpan_local_only@localhost:5432/lokdarpan
          DATABASE_URL_REVIEWER: postgresql://lokdarpan_review:lokdarpan_local_only@localhost:5432/lokdarpan

  e2e:
    name: E2E
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @lokdarpan/web exec playwright install --with-deps chromium
      - name: Playwright
        run: pnpm test:e2e
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: playwright-report
          path: apps/web/playwright-report/
          retention-days: 7

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: quality
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - run: pnpm build

  # ── The OCR service is Python, and is gated like everything else. A spec with
  #    no enforcement mechanism becomes fiction; so does a sidecar service. The
  #    engines themselves are NOT installed here: the suite must pass with them
  #    absent, which is what proves a missing engine is reported rather than
  #    silently halving the evidence.
  ocr:
    name: OCR service · Lint · Tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/ocr
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with: { version: "0.5.11" }
      - name: Lint
        run: uvx ruff@0.7.4 check .
      - name: Format
        run: uvx ruff@0.7.4 format --check .
      - name: Tests
        run: |
          uv venv --python 3.12
          # pypdfium2 and Pillow are core: the renderer decides page geometry,
          # and its tests check every rotation against real pdfium. The OCR
          # engines are still absent, which is what proves a missing engine is
          # reported rather than silently halving the evidence.
          uv pip install --python .venv pydantic pytest pypdfium2 Pillow
          .venv/bin/python -m pytest -q

  security:
    name: Dependencies · Secrets
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - uses: pnpm/action-setup@v4
        with: { version: "${{ env.PNPM_VERSION }}" }
      - uses: actions/setup-node@v4
        with: { node-version: "${{ env.NODE_VERSION }}", cache: pnpm }
      - run: pnpm install --frozen-lockfile
      - name: Known vulnerabilities (high and above)
        # Fails on an advisory; warns, and does not fail, when npm's advisory
        # service cannot be reached. See the script for why those differ.
        run: .github/scripts/audit-dependencies.sh high
      - name: Secret scan
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
