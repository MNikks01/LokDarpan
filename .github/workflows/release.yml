name: Release PR

# Opens (or refreshes) the development -> main release PR. Deployment is a
# separate, manually-approved pipeline: CI verifies, release promotes, and the
# two stay separate so a green build never deploys by itself.
on:
  workflow_dispatch:
  push:
    branches: [development]

permissions:
  contents: read
  pull-requests: write

jobs:
  release-pr:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - name: Open or update the release PR
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if gh pr list --base main --head development --state open --json number \
             | grep -q '"number"'; then
            echo "Release PR already open."
            exit 0
          fi
          gh pr create --base main --head development \
            --title "release: promote development to main" \
            --body "Automated release PR. Merge only when CI is green on \`development\`."
